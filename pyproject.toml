[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ng911check"
description = "Offline NG9-1-1 address and centerline checks, with a severity override that can never hide an ERROR."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ng911", "ng9-1-1", "gis", "address", "centerline", "msag", "data quality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Telecommunications Industry",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
ng911check = "ng911check.cli:main"

[tool.setuptools]
packages = ["ng911check"]

[tool.setuptools.dynamic]
version = {attr = "ng911check.__version__"}
